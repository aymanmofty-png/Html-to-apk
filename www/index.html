<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><title>ملاحظاتي</title>
<style>
:root{--bg:#fff;--fg:#1d1d1f;--mut:#6b7280;--bd:#e5e7eb;--ac:#f59e0b;--sb:#f8f8f6;--hv:#0001}
@media(prefers-color-scheme:dark){:root{--bg:#18181b;--fg:#f4f4f5;--mut:#9ca3af;--bd:#2f2f35;--sb:#202024;--hv:#fff2}}
*{box-sizing:border-box}
body{margin:0;height:calc(var(--vh,1vh)*100);display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button,select,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;border-radius:8px;min-width:36px;height:36px;padding:0 7px}
button:active{background:var(--hv)}
select{background:var(--bg);border:1px solid var(--bd);border-radius:8px;height:34px}
.pg{flex:1;display:flex;flex-direction:column;min-height:0}
.bar{display:flex;align-items:center;gap:4px;padding:8px 10px;border-bottom:1px solid var(--bd)}
.bar h2{flex:1;margin:0;font-size:19px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#q{margin:8px 10px;border:1px solid var(--bd);border-radius:10px;padding:9px 12px;background:var(--bg)}
#ls{flex:1;overflow:auto;padding:0 10px}
.it{display:flex;align-items:center;gap:8px;padding:12px 8px;border-bottom:1px solid var(--bd);cursor:pointer}
.it>span{font-size:24px}.it>div{flex:1;min-width:0}.it b{display:block}
.it small{color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ti{flex:1;border:0;background:none;font-size:19px;font-weight:700;outline:0;min-width:0}
#tabs{display:flex;border-bottom:1px solid var(--bd)}
#tabs button{flex:1;border-radius:0;height:38px;font-size:14px}#tabs .on{border-bottom:3px solid var(--ac);font-weight:700}
.rb{display:flex;flex-wrap:wrap;gap:3px;padding:6px 8px;border-bottom:1px solid var(--bd);background:var(--sb)}
#ew{flex:1;overflow:auto}
#ed{padding:16px;min-height:100%;outline:0;font-size:17px;line-height:26px;overflow-wrap:anywhere}

#ed h1{font-size:1.7em;margin:.4em 0}#ed h2{font-size:1.35em;margin:.4em 0}
#ed blockquote{border-inline-start:3px solid var(--ac);margin:8px 0;padding:0 12px;color:var(--mut)}
#ed img{max-width:100%;height:auto;border-radius:4px}
#ed img{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}#ed img.sel{outline:3px solid #3b82f6;touch-action:none}
.pop{position:fixed;inset:auto 10px 14px;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:4px;max-height:calc(var(--vh,1vh)*45);overflow:auto;box-shadow:0 4px 20px #0005;z-index:5}
.pop button{font-size:22px}.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--bd)}
.md{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:9}
.md>div{background:var(--bg);border-radius:14px;padding:14px;width:min(calc(var(--vw,1vw)*94),440px);text-align:center;max-height:calc(var(--vh,1vh)*96);overflow:auto}
.md canvas{max-width:100%;background:#8884;border-radius:6px;touch-action:none}
.md label{display:flex;gap:8px;align-items:center;font-size:14px;margin:4px 0}.md input[type=range]{flex:1}
#pane,#mw,#ed,#ew{position:relative}
#bc{position:absolute;left:0;top:0;z-index:3;touch-action:none}
#bt{position:fixed;z-index:8;left:4px;top:72px;width:86px;display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:3px;background:var(--bg);border:1px solid var(--bd);border-radius:12px;box-shadow:0 4px 18px #0005}
#bt b{grid-column:1/3;text-align:center;touch-action:none;color:var(--mut);font-size:13px}
#bt button{touch-action:none;min-width:0;width:38px;height:34px;padding:0;font-size:17px}#bt button.on,#bd.on{background:var(--ac);color:#000}
#gl{position:fixed;inset:0;z-index:9;pointer-events:none}
#pt{position:fixed;z-index:9;pointer-events:none;width:8px;height:170px;background:linear-gradient(#fbbf24,#78350f);border-radius:4px;transform-origin:4px 170px;transform:rotate(26deg)}#pt::before{content:'';position:absolute;top:-5px;left:-2px;width:12px;height:12px;border-radius:50%;background:#ef4444;box-shadow:0 0 10px #ef4444}
#tbn{position:fixed;z-index:9;left:8px;bottom:90px;width:auto;height:30px;min-width:0;padding:0 12px!important;border-radius:15px;font-weight:700;background:#dc2626;border:2px solid #fff;box-shadow:0 2px 8px #0006;color:#fff;font-size:11px;padding:0;touch-action:none}#tbn.off{opacity:1;background:#64748b}#tbn:not(.off)::before{content:'✓ '}#fl{position:fixed;z-index:9;left:130px;bottom:90px;width:28px;height:28px;min-width:0;border-radius:50%;background:#475569;border:2px solid #fff;color:#fff;font-size:13px;padding:0}html,body{overflow:hidden}
#tw.mv{border:2px solid #dc2626!important;background:#dc262622!important}#tw{position:fixed;z-index:6;border:1px dotted #dc262633;background:none;pointer-events:none}#tw button{opacity:.35}#tw button:active{opacity:1}
#tw button{pointer-events:auto;position:absolute;right:4px;width:30px;height:30px;min-width:0;background:#dc2626;color:#fff;border-radius:50%;padding:0;touch-action:none;font-size:13px}
#cal{position:fixed;inset:0;z-index:10;background:#000b;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;font-size:17px}#cal button{background:#dc2626;color:#fff;padding:0 18px}
#ec{position:fixed;z-index:9;pointer-events:none;border:2px solid #be185d;border-radius:6px;background:linear-gradient(90deg,#f9a8d4aa 68%,#60a5fa99 68%)}
.wd{position:fixed;left:0;top:0;z-index:7;transform-origin:0 0;pointer-events:none}.wd *{pointer-events:none}
.wd .k{pointer-events:auto;position:absolute;width:30px;height:30px;border-radius:50%;background:#3b82f6;color:#fff;text-align:center;line-height:30px;font-size:15px;touch-action:none;transform:scale(var(--k,1))}
body.pres #tw,body.pres #tbn{display:none}
body.pres .bar,body.pres #mw,body.pres #bt,body.pres #fv,body.pres #rd{display:none}
#oc{position:fixed;z-index:9;pointer-events:none;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:radial-gradient(circle,#ffffffaa,#facc1555 55%,#0000 72%);box-shadow:0 0 14px 4px #facc1566}
#op{position:fixed;z-index:9;pointer-events:none;width:7px;height:64px;margin:-64px 0 0 -3.5px;transform-origin:50% 100%;transform:rotate(45deg);background:linear-gradient(#cbd5e1,#94a3b8 72%,var(--tc,#111) 72%);clip-path:polygon(0 0,100% 0,100% 88%,50% 100%,0 88%)}
.tg{border:1px solid var(--bd);padding:0 10px;font-size:14px}.tg.on{background:var(--ac);color:#000}
#rd{position:fixed;z-index:8;left:6px;top:110px;width:38px;height:38px;border-radius:50%;background:#dc2626;border:3px solid #fff;box-shadow:0 2px 10px #0006;touch-action:none}
#mn{display:inline-block;padding:0 9px;background:#dc2626;color:#fff;border-radius:8px;text-decoration:none}
#so{position:fixed;left:0;top:0;z-index:7;pointer-events:none}#sf{position:absolute;border:2px dashed #3b82f6}
.sk{position:absolute;pointer-events:auto;width:30px;height:30px;border-radius:50%;background:#3b82f6;color:#fff;text-align:center;line-height:30px;touch-action:none;transform:translate(-50%,-50%);font-size:15px}
#fv{position:fixed;z-index:8;top:60px;right:6px;display:flex;gap:2px;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:3px}
.rc{position:absolute;z-index:4;pointer-events:none;transform:translate(-6px,-6px)}.rc i{display:block;width:12px;height:12px;border-radius:50%}.rc span{position:absolute;top:14px;left:8px;color:#fff;font-size:12px;padding:1px 6px;border-radius:8px;white-space:nowrap}
.vt{position:fixed;z-index:9;right:8px;width:130px;background:#000;border-radius:10px;overflow:hidden;touch-action:none}.vt video{width:100%;display:block}.vt u{position:absolute;top:2px;left:4px;color:#fff;font-size:11px;text-decoration:none}.vt s{display:flex;justify-content:space-around;background:#000a;text-decoration:none}.vt i{font-style:normal;color:#fff;padding:4px 8px}
#rc{position:fixed;z-index:9;top:8px;left:50%;transform:translateX(-50%);background:#dc2626;color:#fff;border-radius:18px;padding:0 14px}
.tm{position:fixed;z-index:9;top:90px;left:100px;background:#111c;color:#fff;font:700 28px monospace;padding:6px 12px;border-radius:12px;touch-action:none}.tm i{font-style:normal;font-size:16px;margin-inline-start:10px}
.cu{position:fixed;left:0;right:0;top:56px;z-index:7;background:#334155}
.cu b{position:absolute;bottom:-14px;left:50%;margin-left:-30px;width:60px;height:28px;background:#f59e0b;color:#000;text-align:center;border-radius:14px;touch-action:none}
.cu i{position:absolute;top:8px;left:8px;color:#fff;font-style:normal;padding:8px}
#px{position:fixed;top:6px;left:6px;z-index:9;background:#0006;color:#fff;border-radius:50%;width:34px;height:34px}
#rb{position:absolute;top:100%;left:0;right:0;z-index:6;box-shadow:0 8px 16px #0004}
#ft,#ib,#tf{position:fixed;z-index:7;background:var(--bg);border:1px solid var(--bd);border-radius:12px;box-shadow:0 4px 18px #0005;padding:3px;gap:2px}
#ft{display:flex}#ib{max-width:calc(var(--vw,1vw)*94)}#ft button{min-width:32px;height:32px}
#hd,#tm,#th{position:fixed;z-index:7;width:26px;height:26px;border-radius:50%;background:#3b82f6;border:3px solid #fff;touch-action:none}
#ed p,#ed div{margin:0}
#ed table{border-collapse:collapse;table-layout:fixed;width:100%;margin:8px 0;overflow-wrap:anywhere}
#ed td,#ed th{border:1px solid #888;padding:6px 8px;min-width:30px;vertical-align:top}
#ed table.nb td{border-color:transparent}#tf{max-width:calc(var(--vw,1vw)*94)}
#tm::after{content:'✥';color:#fff;font-size:14px;display:block;text-align:center;line-height:20px}
#ed.rule{background-image:repeating-linear-gradient(transparent 0 25px,var(--bd) 25px 26px);background-origin:content-box;background-clip:content-box}
#ru.on{background:var(--hv);outline:2px solid var(--ac)}
[hidden]{display:none!important}
html.tb,html.tb *{cursor:none!important}</style></head><body>
<div class="pg" id="home">
 <div class="bar"><button id="up">⬅️</button><h2 id="ht"></h2><button id="nd" title="مجلد جديد">📁＋</button><button id="nn" title="ملاحظة جديدة">📝＋</button></div>
 <input id="q" placeholder="🔍 بحث في كل الملاحظات"><div id="ls"></div>
</div>
<div class="pg" id="pane" hidden>
 <div class="bar"><button id="bk">➡️</button><input id="ti" dir="rtl" placeholder="العنوان"><button id="bd" title="أدوات السبورة">🧑‍🏫</button><button id="ru" title="تسطير الصفحة">▤</button><button id="mv" title="نقل إلى مجلد">📂</button><button id="ex" title="تصدير">📤</button><button id="dn" title="حذف">🗑</button></div>
 <div id="mw"><div id="tabs"></div><div class="rb" id="rb" hidden></div></div><div class="rb" id="ib" hidden></div>
 <div id="ew"><div id="ed" contenteditable="true" dir="rtl"></div><canvas id="bc" hidden></canvas></div>
</div>
<div class="md" id="dlg" hidden><div><p id="dlt" style="margin:6px 0 10px"></p><input id="dli" dir="auto" style="width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);margin-bottom:8px"><div><button id="dlo" style="background:var(--ac);color:#000;font-weight:700;padding:0 18px">موافق</button><button id="dlc">إلغاء</button></div></div></div><div class="pop" id="pp" hidden></div><div id="bt" hidden></div><div id="rd" hidden></div><div id="so" hidden><div id="sf"></div></div><canvas id="gl" hidden></canvas><div id="pt" hidden></div><div id="ec" hidden></div><button id="tbn" hidden title="توافق مع لوح الرسم: اضغط للتفعيل/الإيقاف، ضغطة مطولة للمعايرة">توافق</button><button id="fl" hidden title="اقلب اتجاه الواجهة">🔄</button><div id="tw" hidden></div><div id="cal" hidden><div>مرّر قلم اللوح على حواف اللوح الأربعة وزواياه ببطء، ثم اضغط «تم».</div><div id="calt" dir="ltr" style="font:13px/1.55 monospace;text-align:left;white-space:pre;background:#0008;padding:10px 12px;border-radius:10px"></div><div><button id="calok">تم</button> <button id="calsk" style="background:#475569">تخطي</button></div></div><svg id="ols" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9"><line id="ol" stroke="#64748b99" stroke-width="1.2" stroke-dasharray="4 5" style="display:none"/></svg><div id="oc" style="display:none"></div><div id="op" style="display:none"></div><button id="px" hidden>✕</button><div id="ft" hidden></div><div id="hd" hidden></div><div class="rb" id="tf" hidden></div><div id="tm" hidden></div><div id="th" hidden></div>
<div class="md" id="cm" hidden><div><b>قص الصورة</b><br><canvas id="cv"></canvas><div id="cs"></div><button id="ca">✔ تطبيق</button><button id="cx">إلغاء</button></div></div>
<div class="md" id="dm" hidden><div><b>بطاقة الكتابة</b><br><canvas id="dc" width="900" height="600"></canvas>
 <div id="dp" style="display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin:6px 0"></div>
 <label>السمك<input type="range" id="dw" min="2" max="40" value="6"></label>
 <label>الخلفية<select id="dg"><option value="#fffbe6">أصفر فاتح</option><option value="#ffffff">أبيض</option><option value="#1f2937">داكن</option><option value="transparent">شفاف</option></select></label>
 <button id="de">🧽 ممحاة</button><button id="du">↶</button><button id="dr">🗑 مسح</button><button id="ds">✔ حفظ</button><button id="dx">إلغاء</button></div></div>
<input type="file" id="fvid" accept="video/*" hidden><input type="file" id="fpdf" accept="application/pdf" hidden><div id="fv" hidden></div><button id="rc" hidden>⏺ إيقاف التسجيل</button><input type="file" id="fi" accept="image/*,.png,.jpg,.jpeg,.webp,.gif" hidden>
<script>
const $=id=>document.getElementById(id),esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function ask(msg,def,solo){return new Promise(r=>{$('dlt').textContent=msg;const i=$('dli');i.hidden=def==null;i.value=def||'';$('dlc').hidden=!!solo;$('dlg').hidden=false;if(def!=null)setTimeout(()=>i.focus(),60);const f=v=>{$('dlg').hidden=true;r(v)};$('dlo').onclick=()=>f(def==null?true:i.value);$('dlc').onclick=()=>f(def==null?false:null)})}
window.alert=m=>{ask(String(m),undefined,1)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let S={d:[],n:[],cf:null,cn:null},db,tm,rng,img;const ed=$('ed');
const idb=new Promise(r=>{try{const q=indexedDB.open('notesdb',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
const load=async()=>{db=await idb;if(!db)return null;return new Promise(r=>{const g=db.transaction('k').objectStore('k').get('s');g.onsuccess=()=>r(g.result);g.onerror=()=>r(null)})};
const persist=()=>{try{db&&db.transaction('k','readwrite').objectStore('k').put(S,'s')}catch(e){}};
const cur=()=>S.n.find(n=>n.id==S.cn);
const flush=()=>{const n=cur();if(n&&!$('pane').hidden){ed.querySelectorAll('p,div,li,h1,h2,blockquote,td,th').forEach(bidi);n.h=ed.innerHTML.replace(/ class="sel"/g,'');n.p=ed.innerText.slice(0,90)}renderHome();persist()};
const sv=()=>{clearTimeout(tm);tm=setTimeout(flush,700)};
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});
/* الصفحة الرئيسية: مجلدات متداخلة وملاحظات */
const kids=p=>S.d.filter(f=>(f.p||0)==(p||0)),desc=id=>[id,...kids(id).flatMap(k=>desc(k.id))];
const path=()=>{const a=[];let f=S.cf;while(f){const x=S.d.find(d=>d.id==f);if(!x)break;a.unshift(x.n);f=x.p}return a};
function renderHome(){const q=$('q').value.trim().toLowerCase();$('ht').textContent=path().join(' › ')||'📒 ملاحظاتي';$('up').hidden=!S.cf;
 const btn0='<button data-a="r">✎</button><button data-a="x">🗑</button>';
 const btn=btn0.replace('<button','<button hidden').replace('<button hidden','<button'),bn='<button data-a="m">📂</button>'+btn0;
 const fl=q?[]:kids(S.cf).map(f=>`<div class="it" data-k="d" data-i="${f.id}"><span>📁</span><div><b dir="auto">${esc(f.n)}</b><small>${kids(f.id).length} مجلد · ${S.n.filter(n=>n.f==f.id).length} ملاحظة</small></div>${btn}</div>`);
 const nl=S.n.filter(n=>q?((n.t||'')+(n.p||'')).toLowerCase().includes(q):(n.f||0)==(S.cf||0)).sort((a,b)=>b.d-a.d).map(n=>`<div class="it" data-k="n" data-i="${n.id}"><span>📝</span><div><b dir="auto">${esc(n.t||'بدون عنوان')}</b><small dir="auto">${esc(n.p||'')}</small></div>${bn}</div>`);
 $('ls').innerHTML=fl.concat(nl).join('')||'<p style="color:var(--mut);text-align:center;margin-top:40px">فارغ. أنشئ مجلدًا أو ملاحظة من الأزرار أعلاه</p>'}
$('q').oninput=renderHome;
$('up').onclick=()=>{S.cf=(S.d.find(d=>d.id==S.cf)||{}).p||null;renderHome();persist()};
$('nd').onclick=async()=>{const n=await ask('اسم المجلد الجديد','');if(n&&n.trim()){S.d.push({id:uid(),n:n.trim(),p:S.cf||null});renderHome();persist()}};
$('nn').onclick=()=>{const n={id:uid(),f:S.cf||null,t:'',h:'',p:'',d:Date.now()};S.n.push(n);openN(n.id);$('ti').focus()};
$('ls').onclick=async e=>{const it=e.target.closest('.it');if(!it)return;const i=it.dataset.i,d=it.dataset.k=='d',a=e.target.dataset.a,o=d?S.d.find(x=>x.id==i):S.n.find(x=>x.id==i);
 if(a=='r'){const v=await ask('الاسم الجديد',d?o.n:o.t);if(v!=null){d?o.n=v.trim()||o.n:o.t=v;o.d=Date.now();renderHome();persist()}}
 else if(a=='m'){mvNote(i)}
 else if(a=='x'){if(await ask(d?'حذف المجلد وكل ما بداخله؟':'حذف الملاحظة؟')){if(d){const ds=desc(i);S.n=S.n.filter(n=>!ds.includes(n.f));S.d=S.d.filter(f=>!ds.includes(f.id))}else S.n=S.n.filter(n=>n.id!=i);renderHome();persist()}}
 else if(d){S.cf=i;renderHome();persist()}else openN(i)};
function openN(id){S.cn=id;const n=cur();ed.innerHTML=n.h||'';tidy();$('ti').value=n.t||'';$('ti').dir=dirOf($('ti').value);rng=null;sel(null);applyRule();$('home').hidden=true;$('pane').hidden=false;grow(1)}
$('bk').onclick=()=>{if(B)board(0);flush();S.cn=null;$('pane').hidden=true;$('home').hidden=false;renderHome()};
$('dn').onclick=async()=>{if(await ask('حذف هذه الملاحظة؟')){S.n=S.n.filter(n=>n.id!=S.cn);S.cn=null;$('pane').hidden=true;$('home').hidden=false;renderHome();persist()}};
$('ti').oninput=()=>{$('ti').dir=dirOf($('ti').value);const n=cur();if(n){n.t=$('ti').value;n.d=Date.now();sv()}};
ed.oninput=()=>{const n=cur();if(n)n.d=Date.now();sv();posFB();posTF()};
/* التنسيق */
document.addEventListener('selectionchange',()=>{const s=getSelection();if(s.rangeCount&&ed.contains(s.anchorNode))rng=s.getRangeAt(0).cloneRange()});
const rs=()=>{ed.focus();if(rng){const s=getSelection();s.removeAllRanges();s.addRange(rng)}};
const ins=h=>{rs();if(!document.execCommand('insertHTML',false,h))ed.insertAdjacentHTML('beforeend',h);ed.dispatchEvent(new Event('input'))};
const run=(c,v)=>{rs();document.execCommand(c,false,v||null);ed.dispatchEvent(new Event('input'))};
try{document.execCommand('styleWithCSS',false,true);document.execCommand('defaultParagraphSeparator',false,'p')}catch(e){}
