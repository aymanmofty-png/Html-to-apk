name: Publish web board

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build web bundle
        run: |
          node scripts/getfonts.js || true
          mkdir -p _site/lib
          cp -r www/. _site/
          cp node_modules/pdfjs-dist/build/pdf.min.js _site/lib/pdf.min.js
          cp node_modules/pdfjs-dist/build/pdf.worker.min.js _site/lib/pdf.worker.min.js
          cp node_modules/peerjs/dist/peerjs.min.js _site/lib/peerjs.min.js

          sed -i '0,/<head>/s//<head><script>window.__WEB=1<\/script>/' _site/index.html
          touch _site/.nojekyll
          grep -c "__WEB=1" _site/index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
