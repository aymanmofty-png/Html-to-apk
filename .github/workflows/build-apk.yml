name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master, v2-compare]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Patch manifest (permissions)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i '/android.permission.INTERNET/a\    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.ACCESS_NOTIFICATION_POLICY" />' "$M"
          cat "$M"

      - name: Native patch (immersive full screen, hide pointer)
        run: |
          F=$(find android/app/src/main/java -name MainActivity.java | head -1)
          PKG=$(grep -m1 '^package ' "$F" | sed 's/package \(.*\);/\1/')
          cat > "$F" <<EOF
          package $PKG;

          import android.app.NotificationManager;
          import android.content.Context;
          import android.content.Intent;
          import android.provider.Settings;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.PointerIcon;
          import android.view.View;
          import android.view.WindowManager;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            private int oldFilter = -1;
            private boolean asked = false;
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              try {
                if (Build.VERSION.SDK_INT >= 28) {
                  WindowManager.LayoutParams lp = getWindow().getAttributes();
                  lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                  getWindow().setAttributes(lp);
                }
              } catch (Exception e) {}
              immersive();
              hidePointer();
            }

            @Override
            public void onResume() {
              super.onResume();
              immersive();
              hidePointer();
              silence();
            }

            @Override
            public void onPause() {
              restoreSound();
              super.onPause();
            }

            private void silence() {
              try {
                NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                if (nm == null) return;
                if (nm.isNotificationPolicyAccessGranted()) {
                  if (oldFilter < 0) oldFilter = nm.getCurrentInterruptionFilter();
                  nm.setInterruptionFilter(NotificationManager.INTERRUPTION_FILTER_ALARMS);
                } else if (!asked) {
                  asked = true;
                  startActivity(new Intent(Settings.ACTION_NOTIFICATION_POLICY_ACCESS_SETTINGS));
                }
              } catch (Exception e) {}
            }

            private void restoreSound() {
              try {
                NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                if (nm != null && oldFilter >= 0 && nm.isNotificationPolicyAccessGranted()) {
                  nm.setInterruptionFilter(oldFilter);
                }
                oldFilter = -1;
              } catch (Exception e) {}
            }

            @Override
            public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);
              if (hasFocus) {
                immersive();
                hidePointer();
              }
            }

            private void immersive() {
              try {
                WindowInsetsControllerCompat c = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                if (c != null) {
                  c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                  c.hide(WindowInsetsCompat.Type.systemBars());
                }
              } catch (Exception e) {}
            }

            private void hidePointer() {
              try {
                if (Build.VERSION.SDK_INT >= 24 && getBridge() != null && getBridge().getWebView() != null) {
                  View v = getBridge().getWebView();
                  PointerIcon nul = PointerIcon.getSystemIcon(this, PointerIcon.TYPE_NULL);
                  v.setPointerIcon(nul);
                  getWindow().getDecorView().setPointerIcon(nul);
                  v.setOnHoverListener((x, ev) -> { x.setPointerIcon(nul); return false; });
                }
              } catch (Exception e) {}
            }
          }
          EOF
          cat "$F"

      - name: Copy pdf.js into www
        run: |
          mkdir -p www/lib
          cp node_modules/pdfjs-dist/build/pdf.min.js www/lib/pdf.min.js
          cp node_modules/pdfjs-dist/build/pdf.worker.min.js www/lib/pdf.worker.min.js
          ls -la www/lib

      - name: Generate icons
        run: npx capacitor-assets generate --android || true

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
