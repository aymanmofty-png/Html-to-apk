name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Patch manifest (permissions)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i '/android.permission.INTERNET/a\    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.ACCESS_NOTIFICATION_POLICY" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CAMERA" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />' "$M"
          sed -i 's#</application>#    <service android:name=".RoomService" android:exported="false" android:foregroundServiceType="dataSync|microphone|camera" />\n    </application>#' "$M"
          cat "$M"

      - name: Native patch (immersive full screen, hide pointer)
        run: |
          F=$(find android/app/src/main/java -name MainActivity.java | head -1)
          PKG=$(grep -m1 '^package ' "$F" | sed 's/package \(.*\);/\1/')
          cat > "$F" <<EOF
          package $PKG;

          import android.app.NotificationManager;
          import android.content.Context;
          import android.content.Intent;
          import android.provider.Settings;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.PointerIcon;
          import android.view.View;
          import android.view.WindowManager;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            private int oldFilter = -1;
            private boolean asked = false;
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              try {
                if (Build.VERSION.SDK_INT >= 28) {
                  WindowManager.LayoutParams lp = getWindow().getAttributes();
                  lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                  getWindow().setAttributes(lp);
                }
              } catch (Exception e) {}
              try {
                WindowManager.LayoutParams rl = getWindow().getAttributes();
                rl.rotationAnimation = WindowManager.LayoutParams.ROTATION_ANIMATION_JUMPCUT;
                getWindow().setAttributes(rl);
              } catch (Exception e) {}
              immersive();
              hidePointer();
            }

            @Override
            public void onResume() {
              super.onResume();
              immersive();
              hidePointer();
              silence();
            }

            @Override
            public void onPause() {
              restoreSound();
              super.onPause();
              keepWeb();
            }

            @Override
            public void onStop() {
              super.onStop();
              keepWeb();
            }

            private void keepWeb() {
              try {
                if (RoomService.running && getBridge() != null && getBridge().getWebView() != null) {
                  getBridge().getWebView().onResume();
                  getBridge().getWebView().resumeTimers();
                }
              } catch (Exception e) {}
            }

            private void silence() {
              try {
                NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                if (nm == null) return;
                if (nm.isNotificationPolicyAccessGranted()) {
                  if (oldFilter < 0) oldFilter = nm.getCurrentInterruptionFilter();
                  nm.setInterruptionFilter(NotificationManager.INTERRUPTION_FILTER_ALARMS);
                } else if (!asked) {
                  asked = true;
                  startActivity(new Intent(Settings.ACTION_NOTIFICATION_POLICY_ACCESS_SETTINGS));
                }
              } catch (Exception e) {}
            }

            private void restoreSound() {
              try {
                NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                if (nm != null && oldFilter >= 0 && nm.isNotificationPolicyAccessGranted()) {
                  nm.setInterruptionFilter(oldFilter);
                }
                oldFilter = -1;
              } catch (Exception e) {}
            }

            @Override
            public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);
              if (hasFocus) {
                immersive();
                hidePointer();
              }
            }

            private long lastHide = 0;
            @Override
            public boolean dispatchGenericMotionEvent(android.view.MotionEvent ev) {
              boolean r = super.dispatchGenericMotionEvent(ev);
              long n = android.os.SystemClock.uptimeMillis();
              if (n - lastHide > 60) { lastHide = n; hidePointer(); }
              return r;
            }

            @Override
            public boolean dispatchTouchEvent(android.view.MotionEvent ev) {
              boolean r = super.dispatchTouchEvent(ev);
              long n = android.os.SystemClock.uptimeMillis();
              if (n - lastHide > 150) { lastHide = n; hidePointer(); }
              return r;
            }

            private void immersive() {
              try {
                WindowInsetsControllerCompat c = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                if (c != null) {
                  c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                  c.hide(WindowInsetsCompat.Type.systemBars());
                }
              } catch (Exception e) {}
            }

            private boolean ovAdded = false;
            private void addOverlay() {
              try {
                if (ovAdded || Build.VERSION.SDK_INT < 24) return;
                View ov = new View(this);
                ov.setClickable(false);
                ov.setFocusable(false);
                ov.setPointerIcon(PointerIcon.getSystemIcon(this, PointerIcon.TYPE_NULL));
                addContentView(ov, new android.view.ViewGroup.LayoutParams(-1, -1));
                ovAdded = true;
              } catch (Exception e) {}
            }

            private void hidePointer() {
              addOverlay();
              try {
                if (Build.VERSION.SDK_INT >= 24 && getBridge() != null && getBridge().getWebView() != null) {
                  View v = getBridge().getWebView();
                  PointerIcon nul = PointerIcon.getSystemIcon(this, PointerIcon.TYPE_NULL);
                  v.setPointerIcon(nul);
                  getWindow().getDecorView().setPointerIcon(nul);
                }
              } catch (Exception e) {}
            }
          }
          EOF
          cat "$F"

      - name: Native plugin (save to Downloads/سبورتي)
        run: |
          F=$(find android/app/src/main/java -name MainActivity.java | head -1)
          D=$(dirname "$F")
          PKG=$(grep -m1 '^package ' "$F" | sed 's/package \(.*\);/\1/')
          cat > "$D/SaveDl.java" <<EOF
          package $PKG;

          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;

          @CapacitorPlugin(name = "SaveDl")
          public class SaveDl extends Plugin {
            @PluginMethod
            public void save(PluginCall call) {
              try {
                String name = call.getString("name", "file");
                String mime = call.getString("mime", "application/octet-stream");
                byte[] bytes = Base64.decode(call.getString("data", ""), Base64.DEFAULT);
                String where = "Download/سبورتي";
                if (Build.VERSION.SDK_INT >= 29) {
                  ContentResolver cr = getContext().getContentResolver();
                  ContentValues cv = new ContentValues();
                  cv.put(MediaStore.MediaColumns.DISPLAY_NAME, name);
                  cv.put(MediaStore.MediaColumns.MIME_TYPE, mime);
                  cv.put(MediaStore.MediaColumns.RELATIVE_PATH, where);
                  Uri u = cr.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, cv);
                  if (u == null) { call.reject("no uri"); return; }
                  OutputStream os = cr.openOutputStream(u);
                  os.write(bytes); os.close();
                } else {
                  File dir = new File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), "سبورتي");
                  dir.mkdirs();
                  FileOutputStream os = new FileOutputStream(new File(dir, name));
                  os.write(bytes); os.close();
                }
                JSObject r = new JSObject();
                r.put("path", where + "/" + name);
                call.resolve(r);
              } catch (Exception e) {
                call.reject(String.valueOf(e.getMessage()));
              }
            }
          }
          EOF
          sed -i 's/super.onCreate(savedInstanceState);/registerPlugin(SaveDl.class); super.onCreate(savedInstanceState);/' "$F"
          grep -n registerPlugin "$F"

      - name: Native plugin (room keep-alive foreground service)
        run: |
          F=$(find android/app/src/main/java -name MainActivity.java | head -1)
          D=$(dirname "$F")
          PKG=$(grep -m1 '^package ' "$F" | sed 's/package \(.*\);/\1/')
          cat > "$D/RoomService.java" <<EOF
          package $PKG;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;
          import androidx.core.app.NotificationCompat;

          public class RoomService extends Service {
            public static volatile boolean running = false;
            private PowerManager.WakeLock wl;

            @Override
            public IBinder onBind(Intent i) { return null; }

            @Override
            public int onStartCommand(Intent in, int flags, int id) {
              if (in != null && "STOP".equals(in.getAction())) {
                running = false;
                stopForeground(true);
                stopSelf();
                return START_NOT_STICKY;
              }
              String text = (in != null && in.getStringExtra("text") != null) ? in.getStringExtra("text") : "الغرفة مفتوحة";
              if (Build.VERSION.SDK_INT >= 26) {
                NotificationChannel ch = new NotificationChannel("room", "غرفة سبورتي", NotificationManager.IMPORTANCE_LOW);
                ((NotificationManager) getSystemService(NOTIFICATION_SERVICE)).createNotificationChannel(ch);
              }
              Intent open = getPackageManager().getLaunchIntentForPackage(getPackageName());
              PendingIntent pi = PendingIntent.getActivity(this, 0, open, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
              Intent stop = new Intent(this, RoomService.class);
              stop.setAction("STOP");
              PendingIntent ps = PendingIntent.getService(this, 1, stop, PendingIntent.FLAG_IMMUTABLE);
              Notification n = new NotificationCompat.Builder(this, "room")
                .setSmallIcon(getApplicationInfo().icon)
                .setContentTitle("سبورتي")
                .setContentText(text)
                .setContentIntent(pi)
                .setOngoing(true)
                .addAction(0, "إنهاء", ps)
                .build();
              int type = 1;
              if (checkSelfPermission(android.Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED) type |= 128;
              if (checkSelfPermission(android.Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED) type |= 64;
              try {
                if (Build.VERSION.SDK_INT >= 29) startForeground(7, n, type);
                else startForeground(7, n);
              } catch (Exception e) {
                try { startForeground(7, n, 1); } catch (Exception e2) {}
              }
              running = true;
              try {
                if (wl == null) {
                  PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                  wl = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "sabourati:room");
                  wl.acquire(6L * 60L * 60L * 1000L);
                }
              } catch (Exception e) {}
              return START_STICKY;
            }

            @Override
            public void onDestroy() {
              running = false;
              try { if (wl != null && wl.isHeld()) wl.release(); } catch (Exception e) {}
              wl = null;
              super.onDestroy();
            }
          }
          EOF
          cat > "$D/RoomKeep.java" <<EOF
          package $PKG;

          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.PowerManager;
          import android.provider.Settings;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "RoomKeep")
          public class RoomKeep extends Plugin {
            @PluginMethod
            public void start(PluginCall call) {
              try {
                Context c = getContext();
                if (Build.VERSION.SDK_INT >= 33 && ContextCompat.checkSelfPermission(c, "android.permission.POST_NOTIFICATIONS") != PackageManager.PERMISSION_GRANTED) {
                  ActivityCompat.requestPermissions(getActivity(), new String[]{"android.permission.POST_NOTIFICATIONS"}, 77);
                }
                Intent i = new Intent(c, RoomService.class);
                i.putExtra("text", call.getString("text", "الغرفة مفتوحة"));
                ContextCompat.startForegroundService(c, i);
                JSObject rs = new JSObject();
                rs.put("notif", androidx.core.app.NotificationManagerCompat.from(c).areNotificationsEnabled());
                rs.put("sdk", Build.VERSION.SDK_INT);
                call.resolve(rs);
              } catch (Exception e) {
                call.reject(String.valueOf(e.getMessage()));
              }
            }

            @PluginMethod
            public void stop(PluginCall call) {
              try {
                Intent i = new Intent(getContext(), RoomService.class);
                i.setAction("STOP");
                getContext().startService(i);
              } catch (Exception e) {}
              call.resolve();
            }

            @PluginMethod
            public void notifSettings(PluginCall call) {
              try {
                Context c = getContext();
                Intent i = new Intent(Settings.ACTION_APP_NOTIFICATION_SETTINGS);
                i.putExtra(Settings.EXTRA_APP_PACKAGE, c.getPackageName());
                i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                c.startActivity(i);
              } catch (Exception e) {}
              call.resolve();
            }

            @PluginMethod
            public void battery(PluginCall call) {
              JSObject r = new JSObject();
              try {
                Context c = getContext();
                PowerManager pm = (PowerManager) c.getSystemService(Context.POWER_SERVICE);
                boolean ign = pm.isIgnoringBatteryOptimizations(c.getPackageName());
                r.put("ignoring", ign);
                r.put("notif", androidx.core.app.NotificationManagerCompat.from(c).areNotificationsEnabled());
                r.put("running", RoomService.running);
                if (!ign && call.getBoolean("ask", false)) {
                  Intent i = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:" + c.getPackageName()));
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  c.startActivity(i);
                }
              } catch (Exception e) {}
              call.resolve(r);
            }
          }
          EOF
          sed -i 's/registerPlugin(SaveDl.class);/registerPlugin(SaveDl.class); registerPlugin(RoomKeep.class);/' "$F"
          grep -n registerPlugin "$F"

      - name: Copy pdf.js into www
        run: |
          mkdir -p www/lib
          cp node_modules/pdfjs-dist/build/pdf.min.js www/lib/pdf.min.js
          cp node_modules/pdfjs-dist/build/pdf.worker.min.js www/lib/pdf.worker.min.js
          cp node_modules/peerjs/dist/peerjs.min.js www/lib/peerjs.min.js

          ls -la www/lib

      - name: Fetch Arabic fonts into www
        run: node scripts/getfonts.js || true
        continue-on-error: true

      - name: Generate icons
        run: npx capacitor-assets generate --android || true

      - name: Sync web files
        run: npx cap sync android

      - name: Use fixed signing key (so updates keep app data)
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
